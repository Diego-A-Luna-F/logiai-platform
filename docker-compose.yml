version: '3.8'

services:
  # Servicio 1: API de Backend (FastAPI)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logiai_api
    ports:
      - "8000:8000"
    volumes:
      # Sincroniza el código local con el contenedor (Hot Reload)
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Servicio 2: Servidor de Caché (Redis)
  redis:
    image: redis:7-alpine
    container_name: logiai_redis
    ports:
      - "6379:6379"